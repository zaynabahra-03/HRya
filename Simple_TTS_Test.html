<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار TTS بسيط</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            color: white;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #fff;
        }
        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            margin: 10px 0;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            border-left: 4px solid #00b894;
        }
        .error {
            border-left-color: #e74c3c;
            background: rgba(231, 76, 60, 0.1);
        }
        audio {
            width: 100%;
            margin-top: 15px;
        }
        .test-section {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 نظام تحويل النص إلى صوت</h1>
        
        <div class="form-group">
            <label for="textInput">أدخل النص:</label>
            <input type="text" id="textInput" placeholder="اكتب النص هنا..." value="مرحباً من HRya">
        </div>
        
        <div class="form-group">
            <label for="languageSelect">اختر اللغة:</label>
            <select id="languageSelect">
                <option value="ar-XA">العربية</option>
                <option value="en-US">الإنجليزية</option>
                <option value="fr-FR">الفرنسية</option>
                <option value="de-DE">الألمانية</option>
                <option value="es-ES">الإسبانية</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="genderSelect">اختر الجنس:</label>
            <select id="genderSelect">
                <option value="FEMALE">أنثى</option>
                <option value="MALE">ذكر</option>
            </select>
        </div>
        
        <button onclick="convertTextToSpeech()">🔄 تحويل النص إلى صوت</button>
        
        <div class="test-section">
            <h3>🧪 اختبار سريع</h3>
            <button onclick="testSystem()">اختبار النظام</button>
        </div>
        
        <div id="result" class="result" style="display: none;"></div>
        
        <div id="audioContainer" style="display: none;">
            <audio id="audioPlayer" controls>
                متصفحك لا يدعم تشغيل الصوت.
            </audio>
        </div>
    </div>

    <script>
        async function convertTextToSpeech() {
            const text = document.getElementById('textInput').value;
            const language = document.getElementById('languageSelect').value;
            const gender = document.getElementById('genderSelect').value;
            
            if (!text.trim()) {
                showResult('يرجى إدخال نص للتحويل', 'error');
                return;
            }
            
            showResult('جاري التحويل...', '');
            
            try {
                const response = await fetch(`http://localhost:8080/api/tts`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        text: text,
                        languageCode: language,
                        gender: gender
                    })
                });
                
                if (response.ok) {
                    const blob = await response.blob();
                    const audioUrl = URL.createObjectURL(blob);
                    
                    document.getElementById('audioPlayer').src = audioUrl;
                    document.getElementById('audioContainer').style.display = 'block';
                    
                    showResult('تم التحويل بنجاح! استمع للصوت أدناه.', '');
                } else {
                    const errorText = await response.text();
                    showResult(`خطأ في التحويل: ${errorText}`, 'error');
                }
            } catch (error) {
                showResult(`خطأ في الاتصال: ${error.message}`, 'error');
            }
        }
        
        async function testSystem() {
            showResult('جاري اختبار النظام...', '');
            
            try {
                const response = await fetch('http://localhost:8080/api/tts/test');
                
                if (response.ok) {
                    const result = await response.text();
                    showResult(`✅ ${result}`, '');
                } else {
                    const errorText = await response.text();
                    showResult(`❌ خطأ في الاختبار: ${errorText}`, 'error');
                }
            } catch (error) {
                showResult(`❌ خطأ في الاتصال: ${error.message}`, 'error');
            }
        }
        
        function showResult(message, type) {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = message;
            resultDiv.className = `result ${type}`;
            resultDiv.style.display = 'block';
        }
    </script>
</body>
</html>
